[project]
name = "human-api"
version = "0.1.0"
description = "Governed employee knowledge continuity demo"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
