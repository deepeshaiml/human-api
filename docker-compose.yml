services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: human_api
      POSTGRES_USER: human_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-only-change-me}
    volumes:
      - human_api_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U human_api -d human_api"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DATABASE_URL: postgresql+psycopg://human_api:${POSTGRES_PASSWORD:-local-demo-only-change-me}@db:5432/human_api
      ENABLE_ENTERPRISE_CONNECTORS: ${ENABLE_ENTERPRISE_CONNECTORS:-false}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  human_api_pgdata:
